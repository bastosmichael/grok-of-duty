<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enemy Operator QA</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #080a0c;
        color: #e9edf0;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      canvas {
        display: block;
      }
      .title,
      .labels,
      .readout {
        position: fixed;
        z-index: 2;
        pointer-events: none;
      }
      .title {
        top: 24px;
        left: 32px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      .title strong {
        display: block;
        color: #d48822;
        font-size: 18px;
      }
      .labels {
        left: 12%;
        right: 12%;
        bottom: 28px;
        display: flex;
        justify-content: space-between;
        color: #aab2b8;
        text-align: center;
      }
      .labels span {
        width: 28%;
      }
      .labels b {
        display: block;
        color: #fff;
        letter-spacing: 0.12em;
      }
      .readout {
        top: 28px;
        right: 32px;
        color: #9fb3a5;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <div class="title"><strong>Operator physics QA</strong>Live rig / no gameplay overlay</div>
    <div class="readout" id="readout">Checking floor contact…</div>
    <div class="labels">
      <span><b>COMBAT IDLE</b>Two-hand low-ready</span>
      <span><b>LOCOMOTION</b>Distance-driven planted gait</span>
      <span><b>COLLAPSE</b>Articulated, floor-corrected</span>
    </div>
    <script type="module">
      import * as THREE from "/@id/three";
      import {
        createEnemyModel,
        poseEnemyDeath,
        poseEnemyModel,
      } from "/src/game/combat/enemyModel.ts";

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x080a0c);
      scene.fog = new THREE.FogExp2(0x080a0c, 0.045);

      const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 50);
      camera.position.set(0, 2.4, 8.1);
      camera.lookAt(0, 1.0, 0);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.22;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFShadowMap;
      document.body.appendChild(renderer.domElement);

      scene.add(new THREE.HemisphereLight(0xa9c9df, 0x201912, 1.45));
      const key = new THREE.DirectionalLight(0xffe1ba, 4.1);
      key.position.set(-3, 6, 5);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      scene.add(key);
      const rim = new THREE.DirectionalLight(0x8fc8ff, 3.4);
      rim.position.set(5, 3, -4);
      scene.add(rim);

      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(20, 12),
        new THREE.MeshStandardMaterial({ color: 0x1a1d1c, roughness: 0.96, metalness: 0.04 }),
      );
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      scene.add(floor);
      const grid = new THREE.GridHelper(20, 40, 0x4a453a, 0x252824);
      grid.position.y = 0.002;
      scene.add(grid);

      const idle = createEnemyModel(0);
      const moving = createEnemyModel(1);
      const dying = createEnemyModel(2);
      idle.root.position.x = -2.35;
      moving.root.position.x = 0;
      dying.root.position.x = 2.35;
      scene.add(idle.root, moving.root, dying.root);

      const bounds = new THREE.Box3();
      const readout = document.querySelector("#readout");

      function animate() {
        poseEnemyModel(idle.rig, {
          gaitPhase: 0,
          locomotion: 0,
          aim: 0.74,
          recoil: 0,
          flinch: 0,
        });
        poseEnemyModel(moving.rig, {
          gaitPhase: 1.05,
          locomotion: 1,
          aim: 1,
          recoil: 0,
          flinch: 0,
        });
        poseEnemyDeath(dying.rig, 1, 1);

        const models = [idle, moving, dying];
        let floorMinimum = Infinity;
        for (const model of models) {
          model.root.updateMatrixWorld(true);
          bounds.setFromObject(model.root);
          floorMinimum = Math.min(floorMinimum, bounds.min.y);
        }
        readout.textContent = `LOWEST VERTEX  ${floorMinimum.toFixed(4)} m\nROOTS  y=0 · pitch=0 · roll=0`;
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }
      animate();

      addEventListener("resize", () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });
    </script>
  </body>
</html>
